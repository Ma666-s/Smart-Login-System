<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure and smart login system with advanced features">
    <title>Smart Login System | Secure Access</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./images/login_icon_187470.png" type="image/x-icon">
</head>
<body class="bg-gradient-primary">
    <!-- Login Section -->
    <section class="min-vh-100 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card shadow-lg">
                        <div class="card-body p-4 p-md-5">
                            <!-- Logo/Brand -->
                            <div class="text-center mb-4">
                                <h1 class="display-5 fw-bold">
                                    <span class="text-primary">Smart</span> 
                                    <span class="text-success">Login</span>
                                </h1>
                                <p class="text-muted">Secure access to your account</p>
                            </div>
                            
                            <!-- Login Form -->
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="inEmailId" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-envelope"></i>
                                        </span>
                                        <input id="inEmailId" type="email" class="form-control" 
                                               placeholder="Enter your email" required
                                               autocomplete="username">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="inPassId" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                        <input id="inPassId" type="password" class="form-control" 
                                               placeholder="Enter your password" required
                                               autocomplete="current-password">
                                        <button class="btn btn-outline-secondary toggle-password" type="button">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>
                                    <a href="forget-password.html" class="text-decoration-none">Forgot password?</a>
                                </div>
                                
                                <button id="loginId" type="submit" class="btn btn-success w-100 py-2 mb-3">
                                    <i class="fas fa-sign-in-alt me-2"></i> Sign In
                                </button>
                                
                                <div class="text-center">
                                    <p class="text-muted mb-0">Don't have an account?</p>
                                    <a href="sign_up.html" class="text-decoration-none fw-bold">Create an account</a>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <!-- Theme Toggle -->
                    <div class="text-center mt-3">
                        <button id="themeToggle" class="btn btn-sm btn-outline-secondary">
                            <i class="fas fa-moon"></i> Dark Mode
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
