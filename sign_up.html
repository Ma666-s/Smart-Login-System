<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new account for the Smart Login System">
    <title>Smart Login System | Sign Up</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/signUp-style.css">
    <link rel="icon" href="./images/login_icon_187470.png" type="image/x-icon">
</head>
<body class="bg-gradient-primary">
    <!-- Registration Section -->
    <section class="min-vh-100 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card shadow-lg">
                        <div class="card-body p-4 p-md-5">
                            <!-- Logo/Brand -->
                            <div class="text-center mb-4">
                                <h1 class="display-5 fw-bold">
                                    <span class="text-primary">Create</span> 
                                    <span class="text-success">Account</span>
                                </h1>
                                <p class="text-muted">Join our platform today</p>
                            </div>
                            
                            <!-- Registration Form -->
                            <form id="registrationForm">
                                <div class="mb-3">
                                    <label for="upNameId" class="form-label">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <input id="upNameId" type="text" class="form-control" 
                                               placeholder="Enter your name" required
                                               autocomplete="name">
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="upEmailId" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-envelope"></i>
                                        </span>
                                        <input id="upEmailId" type="email" class="form-control" 
                                               placeholder="Enter your email" required
                                               autocomplete="email">
                                    </div>
                                    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                                </div>
                                
                                <div class="mb-4">
                                    <label for="upPassId" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                        <input id="upPassId" type="password" class="form-control" 
                                               placeholder="Enter your password" required
                                               autocomplete="new-password"
                                               minlength="8">
                                        <button class="btn btn-outline-secondary toggle-password" type="button">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                    <div id="passwordHelp" class="form-text">
                                        Password must be at least 8 characters long.
                                    </div>
                                </div>
                                
                                <div class="d-grid mb-3">
                                    <button id="registerId" type="submit" class="btn btn-success py-2">
                                        <i class="fas fa-user-plus me-2"></i> Sign Up
                                    </button>
                                </div>
                                
                                <div class="text-center">
                                    <p class="text-muted mb-0">Already have an account?</p>
                                    <a href="index.html" class="text-decoration-none fw-bold">Sign in here</a>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <!-- Theme Toggle -->
                    <div class="text-center mt-3">
                        <button id="themeToggle" class="btn btn-sm btn-outline-secondary">
                            <i class="fas fa-moon"></i> Dark Mode
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/sign-up.js"></script>
</body>
</html>
