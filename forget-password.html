<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery | Smart Login System</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/forgot-password.css">
    <link rel="icon" href="./images/login_icon_187470.png" type="image/x-icon">
</head>
<body class="bg-gradient-primary">
    <section class="min-vh-100 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card shadow-lg">
                        <div class="card-body p-4 p-md-5">
                            <!-- Recovery Header -->
                            <div class="text-center mb-4">
                                <i class="fas fa-key fa-3x text-success mb-3"></i>
                                <h2 class="fw-bold">Password Recovery</h2>
                                <p class="text-muted">Enter your email to reset your password</p>
                            </div>
                            
                            <!-- Recovery Form -->
                            <form id="recoveryForm">
                                <div class="mb-4">
                                    <label for="recoveryEmail" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-envelope"></i>
                                        </span>
                                        <input id="recoveryEmail" type="email" class="form-control" 
                                               placeholder="Your registered email" required
                                               autocomplete="email">
                                    </div>
                                </div>
                                
                                <div class="d-grid gap-2">
                                    <button id="recoveryBtn" type="submit" class="btn btn-success py-2">
                                        <i class="fas fa-paper-plane me-2"></i> Send Reset Link
                                    </button>
                                    <a href="index.html" class="btn btn-outline-secondary">
                                        <i class="fas fa-arrow-left me-2"></i> Back to Login
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <!-- Theme Toggle -->
                    <div class="text-center mt-3">
                        <button id="themeToggle" class="btn btn-sm btn-outline-secondary">
                            <i class="fas fa-moon"></i> Dark Mode
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/forgot-password.js"></script>
</body>
</html>
